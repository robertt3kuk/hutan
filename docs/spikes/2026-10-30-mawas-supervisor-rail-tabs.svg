<text x="619.0" y="230" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">Edit</text>
<rect x="649" y="214" width="60" height="22" fill="#262624" rx="6" stroke="#2F2E2C" stroke-width="1"/>
<text x="679.0" y="230" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">Reject</text>
<rect x="510" y="254" width="380" height="82" fill="#262624" rx="8"/>
<text x="522" y="278" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">“Staging deploys need the VPN.”</text>
<text x="522" y="294" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">edited in a memory file</text>
<rect x="522" y="304" width="67" height="22" fill="#F5F4EF" rx="6"/>
<text x="555.5" y="320" font-size="11.5" fill="#141413" font-weight="600" text-anchor="middle">Approve</text>
<rect x="595" y="304" width="48" height="22" fill="#262624" rx="6" stroke="#2F2E2C" stroke-width="1"/>
<text x="619.0" y="320" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">Edit</text>
<rect x="649" y="304" width="60" height="22" fill="#262624" rx="6" stroke="#2F2E2C" stroke-width="1"/>
<text x="679.0" y="320" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">Reject</text>
<text x="516" y="354" font-size="10" fill="#6F6D66" font-weight="700" text-anchor="start" letter-spacing="0.8">LATEST · 5 OF 38</text>
<line x1="514" y1="364" x2="886" y2="364" stroke="#2F2E2C" stroke-width="1"/>
<text x="516" y="384" font-size="11.5" fill="#F5F4EF" font-weight="400" text-anchor="start">Prefers small commits, no squash</text>
<text x="884" y="384" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="end">profile</text>
<line x1="514" y1="394" x2="886" y2="394" stroke="#2F2E2C" stroke-width="1"/>
<text x="516" y="414" font-size="11.5" fill="#F5F4EF" font-weight="400" text-anchor="start">api uses nextest, not cargo test</text>
<text x="884" y="414" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="end">fact · api</text>
<line x1="514" y1="424" x2="886" y2="424" stroke="#2F2E2C" stroke-width="1"/>
<text x="516" y="444" font-size="11.5" fill="#F5F4EF" font-weight="400" text-anchor="start">Release branches are cut on Thursdays</text>
<text x="884" y="444" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="end">note · web</text>
<rect x="514" y="468" width="76" height="24" fill="#262624" rx="6" stroke="#2F2E2C" stroke-width="1"/>
<text x="552.0" y="484" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">＋ Add…</text>
<rect x="598" y="468" width="112" height="24" fill="#262624" rx="6" stroke="#2F2E2C" stroke-width="1"/>
<text x="654.0" y="484" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">Open Memory ›</text>
<text x="516" y="520" font-size="10.5" fill="#6F6D66" font-weight="400" text-anchor="start">Memory keeps its page in the left sidebar; the rail only</text>
<text x="516" y="536" font-size="10.5" fill="#6F6D66" font-weight="400" text-anchor="start">shows what is waiting and what is newest.</text>
<rect x="940" y="80" width="440" height="230" fill="#1F1E1D" rx="10" stroke="#2F2E2C" stroke-width="1"/>
<text x="956" y="108" font-size="13" fill="#F5F4EF" font-weight="600" text-anchor="start">Settings → Mawas → Layout</text>
<text x="956" y="136" font-size="12" fill="#F5F4EF" font-weight="400" text-anchor="start">Chat width</text>
<text x="1270" y="136" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="end">46 rem   [Reset]</text>
<text x="956" y="151" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="start">assistant.chat_width_rem</text>
<text x="956" y="178" font-size="12" fill="#F5F4EF" font-weight="400" text-anchor="start">Show the side panel</text>
<text x="1270" y="178" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="end">On</text>
<text x="956" y="193" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="start">assistant.rail_open</text>
<text x="956" y="220" font-size="12" fill="#F5F4EF" font-weight="400" text-anchor="start">Side panel width  (with the Now tab)</text>
<text x="1270" y="220" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="end">340 px</text>
<text x="956" y="235" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="start">assistant.rail_width</text>
<text x="956" y="262" font-size="12" fill="#F5F4EF" font-weight="400" text-anchor="start">Hide idle agents  (with the Now tab)</text>
<text x="1270" y="262" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="end">On</text>
<text x="956" y="277" font-size="10" fill="#6F6D66" font-weight="400" text-anchor="start">assistant.rail_hide_idle</text>
<text x="940" y="342" font-size="11" fill="#6F6D66" font-weight="400" text-anchor="start">Dragging an edge writes these keys on release;</text>
<text x="940" y="358" font-size="11" fill="#6F6D66" font-weight="400" text-anchor="start">⌘K: “Mawas: Reset Chat Width”, “Mawas: Toggle Today”.</text>
</svg>
