<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12">
<title>Mawas rail: Recent (since you were away) and Memory</title>
<desc>Mock: the two other tabs of the right rail. Recent: a catch-up computed from recorded facts with no model call and one button to ask Mawas to summarise it. Memory: proposals waiting, newest entries, add. Invented data.</desc>
<rect x="0" y="0" width="1440" height="760" fill="#141413"/>
<text x="24" y="34" font-size="15" fill="#F5F4EF" font-weight="600" text-anchor="start">Rail tabs, 340 px: one column, tabs instead of five stacked panels</text>
<text x="24" y="54" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="start">Left: Recent (deterministic, no model call). Right: Memory. The Now tab is the first mock.</text>
<rect x="60" y="80" width="400" height="640" fill="#1F1E1D" rx="10" stroke="#2F2E2C" stroke-width="1"/>
<text x="83" y="107" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="start">Now · 4</text>
<rect x="144" y="90" width="59" height="26" fill="#262624" rx="6"/>
<text x="153" y="107" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">Recent</text>
<text x="216" y="107" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="start">Memory · 2</text>
<line x1="60" y1="126" x2="460" y2="126" stroke="#2F2E2C" stroke-width="1"/>
<text x="76" y="150" font-size="10" fill="#6F6D66" font-weight="700" text-anchor="start" letter-spacing="0.8">SINCE YOU WERE AWAY · 9 h</text>
<text x="444" y="150" font-size="10.5" fill="#6F6D66" font-weight="400" text-anchor="end">since 21:40</text>
<rect x="70" y="164" width="380" height="54" fill="#262624" rx="8"/>
<text x="86" y="196" font-size="15" fill="#6BBF85" font-weight="700" text-anchor="middle">✓</text>
<text x="104" y="188" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">6 turns finished</text>
<text x="104" y="205" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">api ×4 · infra ×2 · 18 min of agent time</text>
<rect x="70" y="226" width="380" height="54" fill="#262624" rx="8"/>
<text x="86" y="258" font-size="15" fill="#E2AE45" font-weight="700" text-anchor="middle">!</text>
<text x="104" y="250" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">2 requests waited</text>
<text x="104" y="267" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">6 min and 41 min (still open)</text>
<rect x="70" y="288" width="380" height="54" fill="#262624" rx="8"/>
<text x="86" y="320" font-size="15" fill="#E5675F" font-weight="700" text-anchor="middle">✕</text>
<text x="104" y="312" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">1 turn failed</text>
<text x="104" y="329" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">api · Add rate limiter · “the provider failed”</text>
<rect x="70" y="350" width="380" height="54" fill="#262624" rx="8"/>
<text x="86" y="382" font-size="15" fill="#AEACA4" font-weight="700" text-anchor="middle">≈</text>
<text x="104" y="374" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">27 files changed</text>
<text x="104" y="391" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">+640 −210 · 5 checkpoints kept</text>
<rect x="70" y="412" width="380" height="54" fill="#262624" rx="8"/>
<text x="86" y="444" font-size="15" fill="#AEACA4" font-weight="700" text-anchor="middle">◇</text>
<text x="104" y="436" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">1 task done, 1 blocked</text>
<text x="104" y="453" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">“Rotate staging certs” done · “Seed data” blocked by it</text>
<rect x="74" y="480" width="170" height="24" fill="#F5F4EF" rx="6"/>
<text x="159.0" y="496" font-size="11.5" fill="#141413" font-weight="600" text-anchor="middle">Summarise with Mawas</text>
<rect x="252" y="480" width="110" height="24" fill="#262624" rx="6" stroke="#2F2E2C" stroke-width="1"/>
<text x="307.0" y="496" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="middle">Choose time ▾</text>
<rect x="70" y="524" width="380" height="90" fill="none" rx="8" stroke="#2F2E2C" stroke-width="1"/>
<text x="82" y="546" font-size="11" fill="#F5F4EF" font-weight="600" text-anchor="start">How complete is this?</text>
<text x="82" y="564" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">Chats: every turn, request and file (exact).</text>
<text x="82" y="580" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">Terminal agents: only the state they reported.</text>
<text x="82" y="596" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">Agents outside Hutan: not seen.</text>
<rect x="500" y="80" width="400" height="640" fill="#1F1E1D" rx="10" stroke="#2F2E2C" stroke-width="1"/>
<text x="523" y="107" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="start">Now · 4</text>
<text x="593" y="107" font-size="12" fill="#AEACA4" font-weight="400" text-anchor="start">Recent</text>
<rect x="647" y="90" width="87" height="26" fill="#262624" rx="6"/>
<text x="656" y="107" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">Memory · 2</text>
<line x1="500" y1="126" x2="900" y2="126" stroke="#2F2E2C" stroke-width="1"/>
<text x="516" y="150" font-size="10" fill="#E2AE45" font-weight="700" text-anchor="start" letter-spacing="0.8">WAITING FOR YOU · 2</text>
<rect x="510" y="164" width="380" height="82" fill="#262624" rx="8"/>
<text x="522" y="188" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">“Uses jj for version control.”</text>
<text x="522" y="204" font-size="10.5" fill="#AEACA4" font-weight="400" text-anchor="start">proposed by Mawas · web</text>
<rect x="522" y="214" width="67" height="22" fill="#F5F4EF" rx="6"/>
<text x="555.5" y="230" font-size="11.5" fill="#141413" font-weight="600" text-anchor="middle">Approve</text>
