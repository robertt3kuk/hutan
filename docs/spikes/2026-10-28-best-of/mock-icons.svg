<rect x="12.00" y="440.00" width="956.00" height="188.00" rx="10" fill="#1F1E1D" />
<text x="28.00" y="466.00" font-size="10" fill="#AEACA4" font-weight="600" text-anchor="start" letter-spacing="0.75">ICON PACK RULES</text>
<circle cx="34.00" cy="485.00" r="2" fill="#EA7A43"/>
<text x="46.00" y="488.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Family stays Phosphor (MIT, pinned, every semantic id already mapped). It is a pack choice, so a user pack can still replace it.</text>
<circle cx="34.00" cy="506.00" r="2" fill="#EA7A43"/>
<text x="46.00" y="509.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Weight by size: Regular at 16 px and up (nav, panel headers, buttons); Bold at 12–14 px (row glyphs, tab icons, badges). See mock-icons-weight.svg for the measurement.</text>
<circle cx="34.00" cy="527.00" r="2" fill="#EA7A43"/>
<text x="46.00" y="530.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Row glyph 14 px in a 16 px lane; tab icon 14 px; chip and badge 8–12 px; nav and header 16 px. Colour is always `muted`, `fg` on the selected row; state colour only on the</text>
<text x="46.00" y="545.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">badge.</text>
<circle cx="34.00" cy="563.00" r="2" fill="#EA7A43"/>
<text x="46.00" y="566.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Harness ids `harness.omp|claude|codex|direct|shell` stop pointing at `terminal.svg`, `chat-circle.svg`, `robot.svg` (ids.rs:83-86) and get the monograms above; the user's</text>
<text x="46.00" y="581.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">pack wins per id.</text>
<circle cx="34.00" cy="599.00" r="2" fill="#EA7A43"/>
<text x="46.00" y="602.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">A second weight is a second set of files under the same ids: `icon-theme.toml` gains an optional `[small]` table (≤ 14 px) that falls back to the Regular file when absent; no</text>
<text x="46.00" y="617.00" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">breaking change for packs.</text>
</svg>
