<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">Chrome v3 — three left-sidebar states and collapsed right rail</title><desc id="desc">Three comparable windows show expanded 280-point sidebar, compact 44-point icon rail, and fully hidden sidebar with external titlebar recovery. All retain an independent outer-right panel icon rail. Fourth detail shows active-icon collapse and reopening. Dimensions in window drawings are schematic.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:var(--fg);font-size:12px}.heading{font-size:15px;font-weight:600}.muted{fill:var(--muted);font-size:11px}.accent{fill:var(--accent)}.line{fill:none;stroke:var(--border)}.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><g id="sidebar" class="icon"><rect x="1" y="1" width="17" height="14" rx="2"/><path d="M6 1v14"/></g><g id="search" class="icon"><circle cx="7" cy="7" r="5"/><path d="m11 11 5 5"/></g><g id="robot" class="icon"><rect x="2" y="5" width="16" height="12" rx="3"/><path d="M10 1v4M6 10h1m6 0h1M7 14h6"/></g><g id="tasks" class="icon"><path d="m1 4 2 2 4-5m2 3h9M1 11h17M1 17h17"/></g><g id="history" class="icon"><path d="M4 4a8 8 0 1 1-2 9M1 1v6h5m4-2v5l4 2"/></g><g id="diff" class="icon"><path d="M4 2v16m12-16v16M1 6h6m-3-3v6m9 5h6"/></g><g id="request" class="icon"><path d="M4 10V6a1 1 0 0 1 2 0v4-7a1 1 0 0 1 2 0v7-8a1 1 0 0 1 2 0v8-6a1 1 0 0 1 2 0v8l2-2q3-2 3 1l-4 7H7l-5-7q-1-3 2-1Z"/></g><g id="gauge" class="icon"><path d="M1 13a9 9 0 1 1 18 0M10 11l6-5"/></g><g id="rail"><path class="line" d="M0 0v263"/><g color="var(--muted)"><use href="#history" x="7" y="14"/><use href="#diff" x="7" y="52"/><use href="#request" x="7" y="90"/><use href="#robot" x="7" y="128"/><use href="#gauge" x="7" y="166"/></g><path class="icon" color="var(--muted)" d="m11 239 5-5-5-5"/></g><g id="window"><rect class="line" x="0" y="0" width="300" height="300" rx="7"/><path class="line" d="M0 33H300M0 277H300"/><g class="icon" color="var(--muted)"><circle cx="12" cy="17" r="3"/><circle cx="24" cy="17" r="3"/><circle cx="36" cy="17" r="3"/></g><use href="#sidebar" x="52" y="10" color="var(--accent)"/><text x="84" y="22" class="muted">Active work</text><use href="#sidebar" x="272" y="10" color="var(--muted)"/><text x="11" y="293" class="muted">hutand connected</text></g></defs>
<text x="0" y="23" class="heading">Expanded</text><text x="0" y="45" class="muted">280 pt preferred · labels and project tree</text><g transform="translate(0 62)"><use href="#window"/><path class="line" d="M112 33v244"/><use href="#rail" x="266" y="33"/><text x="12" y="63">Search</text><text x="12" y="91">Tasks</text><text x="12" y="119" class="accent">Agents</text><text x="12" y="147">Mawas</text><text x="12" y="187">Projects</text><text x="18" y="213" class="muted">hutan</text><text x="27" y="236" class="muted">Chrome cleanup</text><text x="126" y="105" class="muted">Terminal / Chat</text><text x="126" y="128" class="muted">Main work stays live</text></g>
<text x="330" y="23" class="heading">Compact</text><text x="330" y="45" class="muted">44 pt rail · ⌘B returns to expanded</text><g transform="translate(330 62)"><use href="#window"/><path class="line" d="M38 33v244"/><use href="#rail" x="266" y="33"/><use href="#search" x="10" y="50" color="var(--muted)"/><use href="#sidebar" x="9" y="88" color="var(--muted)"/><use href="#tasks" x="9" y="126" color="var(--muted)"/><rect x="5" y="159" width="28" height="29" rx="5" fill="none" stroke="var(--accent)"/><use href="#robot" x="9" y="164" color="var(--accent)"/><path class="icon" color="var(--muted)" d="M11 250h15m-7-7v14"/><text x="56" y="105" class="muted">Terminal / Chat</text><text x="56" y="128" class="muted">More room; same navigation</text></g>
<text x="660" y="23" class="heading">Hidden</text><text x="660" y="45" class="muted">0 pt · external titlebar button restores</text><g transform="translate(660 62)"><use href="#window"/><use href="#rail" x="266" y="33"/><text x="19" y="105" class="muted">Terminal / Chat</text><text x="19" y="128" class="muted">No hidden input receives focus</text><path class="icon" color="var(--accent)" d="M60 34v28m-5-5 5 5 5-5"/><text x="19" y="84" class="accent">Sidebar recovery</text></g>
<text x="0" y="402" class="heading">Right body collapses; the icon rail does not</text><text x="0" y="426" class="muted">⌘L or the active icon: expanded → rail only. Any icon in rail-only mode: expand selected panel.</text>
<rect class="line" x="1" y="446" width="958" height="169" rx="7"/><path class="line" d="M503 446v169M706 446v169M919 446v169"/>
<text x="18" y="473" class="heading">Center work</text><text x="18" y="500" class="muted">Collapse does not close sessions, remove tabs, or dismiss approvals.</text><text x="18" y="526" class="muted">Focused dock collapses → last active center target receives focus.</text><text x="18" y="552" class="muted">Manual state persists per layout; automatic shrink is temporary.</text><text x="18" y="588" class="accent">Drag 24 pt beyond minimum, release to collapse · Escape cancels</text>
<text x="520" y="473" class="heading">Agents</text><text x="520" y="495" class="muted">Workspace: Chrome cleanup</text><text x="520" y="525">Fix dock collapse</text><text x="520" y="547" class="muted">Permission required</text><text x="520" y="588" class="muted">Expanded body 240–480 pt</text>
<text x="723" y="473" class="heading">Rail only</text><text x="723" y="501" class="muted">Body width: 0 pt</text><text x="723" y="526" class="muted">Rail: 40 pt</text><text x="723" y="552" class="muted">Badge remains</text><text x="723" y="588" class="muted">Titlebar recovery stays</text>
<g color="var(--muted)"><use href="#history" x="930" y="459"/><use href="#diff" x="930" y="489"/><use href="#request" x="930" y="519"/><use href="#robot" x="930" y="549"/><use href="#gauge" x="930" y="579"/></g>
<text x="0" y="645" class="muted">Default auto-collapse: right body below 1180 pt; compact left below 900 pt; preserve 480 pt center; +80 pt restore hysteresis.</text><text x="0" y="669" class="muted">The old dashboard drawer is removed: Agents is a center tab, so collapsing either dock never destroys the dashboard.</text>
</svg>
