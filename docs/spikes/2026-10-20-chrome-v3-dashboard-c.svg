<title id="title">Agents v2 C — two-lane review board</title><desc id="desc">Alternative attention and other-agents card layout. Needs-you reasons are shown on two cards. Working, unconfirmed assistant, and idle agents are in the second lane. No empty kanban columns. Illustrative data.</desc>
