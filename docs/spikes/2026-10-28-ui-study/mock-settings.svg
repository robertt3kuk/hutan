<line x1="244" y1="604" x2="900" y2="604" stroke="#33322F" stroke-width="1"/>
<text x="276" y="626" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Problems · none</text>
<text x="920" y="44" font-size="13" fill="#F5F4EF" font-weight="600" text-anchor="start">Spacing scale (pt)</text>
<text x="920" y="70" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• 4 · 8 · 12 · 16 · 24 · 32 — nothing else</text>
<text x="920" y="92" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Sheet 880 × 620, nav 224</text>
<text x="920" y="114" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Page padding 32 left/right</text>
<text x="920" y="136" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Page title 20 semibold + 13 muted line</text>
<text x="920" y="158" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Section label 12 semibold, 24 above, 10 below</text>
<text x="920" y="180" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Card: 10 radius, `bg` on `surface`, no border</text>
<text x="920" y="202" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Row 52 fixed: label 13 / help 12 (one line)</text>
<text x="920" y="224" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Row text inset 16; hairline inset 16</text>
<text x="920" y="246" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Control column 168 wide, right edge 16 from card</text>
<text x="920" y="268" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Nav: 28 rows, 16 px icon, 12 gap, 11 group labels</text>
<text x="920" y="290" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• Footer 36: Problems line, one line</text>
<text x="920" y="330" font-size="13" fill="#F5F4EF" font-weight="600" text-anchor="start">What changed against today</text>
<text x="920" y="356" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• icons in the nav (Orca, Zed, Linear)</text>
<text x="920" y="378" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• one fixed row height (today 52 / 65 / 79 pt)</text>
<text x="920" y="400" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• help is one line; the full text is the tooltip</text>
<text x="920" y="422" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• all controls share one width and one edge</text>
<text x="920" y="444" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• page description line (Orca)</text>
<text x="920" y="466" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• rows grouped into labelled cards (Orca, macOS)</text>
<text x="920" y="488" font-size="11.5" fill="#C9C7BF" font-weight="400" text-anchor="start">• one page per namespace today (34) → about 14 pages in 5 groups</text>
