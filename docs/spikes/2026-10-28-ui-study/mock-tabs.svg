<line x1="20" y1="170" x2="1020" y2="170" stroke="#33322F" stroke-width="1"/>
<text x="20" y="208" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Left to right: working (spinner) · blocked on you (warning, stays until answered) · finished with an unread result (bell, clears when the tab is shown) · failed · idle · plain shell.</text>
<text x="20" y="236" font-size="12" fill="#F5F4EF" font-weight="600" text-anchor="start">Marks and where each comes from</text>
<line x1="20" y1="246" x2="1020" y2="246" stroke="#33322F" stroke-width="1"/>
<text x="24" y="270" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">spinner</text>
<text x="150" y="270" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">state=working</text>
<text x="560" y="270" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">OSC 7501 / OMP extension / Claude and Codex hooks</text>
<line x1="20" y1="278" x2="1020" y2="278" stroke="#33322F" stroke-width="1"/>
<text x="24" y="294" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">warning</text>
<text x="150" y="294" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">state=blocked (+ kind, msg = the question)</text>
<text x="560" y="294" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">OSC 7501 kind=permission|question|auth / hook approval events</text>
<line x1="20" y1="302" x2="1020" y2="302" stroke="#33322F" stroke-width="1"/>
<text x="24" y="318" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">check + bell</text>
<text x="150" y="318" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">state=done, or a normal turn end after work</text>
<text x="560" y="318" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">OSC 7501 done; extension agent_end; clears on focus</text>
<line x1="20" y1="326" x2="1020" y2="326" stroke="#33322F" stroke-width="1"/>
<text x="24" y="342" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">danger</text>
<text x="150" y="342" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">state=error (+ msg)</text>
<text x="560" y="342" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">OSC 7501 error; hook failure; process exit ≠ 0</text>
<line x1="20" y1="350" x2="1020" y2="350" stroke="#33322F" stroke-width="1"/>
<text x="24" y="366" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">hollow</text>
<text x="150" y="366" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">state=idle (dim: the agent is alive and waits for the next prompt)</text>
<text x="560" y="366" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">OSC 7501 idle; foreground process is a known harness</text>
<line x1="20" y1="374" x2="1020" y2="374" stroke="#33322F" stroke-width="1"/>
<text x="24" y="390" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">bell, muted</text>
<text x="150" y="390" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">BEL (0x07) from a plain program while the tab is not shown</text>
<text x="560" y="390" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">terminal engine; Zed, Ghostty, iTerm2 do the same</text>
<line x1="20" y1="398" x2="1020" y2="398" stroke="#33322F" stroke-width="1"/>
<text x="24" y="414" font-size="11.5" fill="#F5F4EF" font-weight="500" text-anchor="start">title</text>
<text x="150" y="414" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">session name: user name &gt; agent session title &gt; folder/command</text>
<text x="560" y="414" font-size="11.5" fill="#AEACA4" font-weight="400" text-anchor="start">OSC 0/2 title with the “π &gt;” wrapper removed; transcript title (OMP title slot)</text>
<line x1="20" y1="422" x2="1020" y2="422" stroke="#33322F" stroke-width="1"/>
<text x="20" y="448" font-size="11" fill="#AEACA4" font-weight="400" text-anchor="start">Rule: one state mark + one bell per tab. A bell never plays sound by itself (the notification policy of docs/design.md § Attention decides); focus clears it.</text>
</svg>
