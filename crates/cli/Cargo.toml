[package]
name = "hutan-cli"
description = "hutan: command-line client for hutand, and the host-terminal renderer used by attach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "hutan_cli"

[[bin]]
name = "hutan"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
hutan-client.workspace = true
hutan-core.workspace = true
hutan-protocol.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time", "io-std", "io-util"] }
toml_edit.workspace = true
ulid.workspace = true
unicode-width.workspace = true

[dev-dependencies]
hutan-agents.workspace = true
hutan-daemon.workspace = true
hutan-gateway = { workspace = true, features = ["test-support"] }
hutan-storage.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread"] }
vt100.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
