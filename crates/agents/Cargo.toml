[package]
name = "hutan-agents"
description = "Agent adapters behind one AgentAdapter trait: Codex app-server over stdio JSON-RPC (ADR 0005), ACP agents (OMP, Claude Code; ADR 0015), and the fixture tools that record, scrub and replay their transcripts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "hutan_agents"

[[bin]]
name = "hutan-codex-fixture"
path = "src/bin/codex_fixture.rs"

[[bin]]
name = "hutan-acp-fixture"
path = "src/bin/acp_fixture.rs"

[dependencies]
base64.workspace = true
futures.workspace = true
hutan-core.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
