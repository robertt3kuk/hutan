[package]
name = "hutan-settings"
description = "Hutan layered TOML settings: schemas, hot reload, keymap, appearance density, color packs (no GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
libc.workspace = true
notify.workspace = true
parking_lot.workspace = true
roxmltree.workspace = true
rustix.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
svgtypes.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[dev-dependencies]
# The token-name equality test of the `syntax.*` registry (E-4); not a runtime dependency.
hutan-syntax.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
