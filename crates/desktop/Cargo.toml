[package]
name = "hutan-desktop"
description = "hutan-desktop: GPUI workbench (docks, pane tree, panels, palette, presets)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "hutan_desktop"

[[bin]]
name = "hutan-desktop"
path = "src/main.rs"

[dependencies]
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
hutan-chat-view.workspace = true
hutan-client.workspace = true
hutan-code-view.workspace = true
hutan-core.workspace = true
hutan-protocol.workspace = true
hutan-settings.workspace = true
hutan-terminal-view.workspace = true
hutan-vim.workspace = true
libc.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The conflict bar's Show Diff (the file on disk against the unsaved buffer).
similar = { workspace = true, features = ["text"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-service-management.workspace = true
objc2-user-notifications.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
hutan-agents.workspace = true
hutan-daemon.workspace = true
hutan-gateway = { workspace = true, features = ["test-support"] }
hutan-storage.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
