[package]
name = "hutan-code-view"
description = "Hutan GPUI code view: the file editor element (visible lines only, tree-sitter highlights, find and replace, editing, Vim over the rope) over a shared file buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false

[lib]
name = "hutan_code_view"

[dependencies]
futures.workspace = true
gpui.workspace = true
hutan-buffer.workspace = true
hutan-settings.workspace = true
hutan-syntax.workspace = true
hutan-ui.workspace = true
hutan-vim.workspace = true
regex.workspace = true
similar.workspace = true
tracing.workspace = true
unicode-width.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[[bench]]
name = "vim"
path = "benches/vim.rs"
harness = false

[lints]
workspace = true
