[package]
name = "hutan-daemon"
description = "hutand: Hutan daemon lifecycle, connection layer, event bus, request router, and terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "hutan_daemon"

[[bin]]
name = "hutand"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hutan-agents.workspace = true
hutan-core.workspace = true
hutan-gateway.workspace = true
hutan-index.workspace = true
hutan-protocol.workspace = true
hutan-storage.workspace = true
hutan-terminal.workspace = true
ignore.workspace = true
libc.workspace = true
notify.workspace = true
parking_lot.workspace = true
regex.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "main_thread_loop"
path = "tests/main_thread_loop.rs"
harness = false

[features]
# `notify_native::fake::FakePoster` for tests (this crate's own and its integration tests), and
# `testing::DaemonReaper` for the tests of every crate that runs `hutand` as a process.
test-support = []

[dev-dependencies]
hutan-daemon = { path = ".", features = ["test-support"] }
hutan-client.workspace = true
hutan-gateway = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
