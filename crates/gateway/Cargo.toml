[package]
name = "hutan-gateway"
description = "Model gateway: OpenAI-compatible, Anthropic and Ollama adapters behind one Provider trait, and the credential store for provider API keys (ADR 0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "hutan_gateway"

[features]
# A scriptable HTTP server (`hutan_gateway::testing`) for tests of this crate and the daemon.
test-support = ["tokio/net", "tokio/io-util"]

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hutan-core.workspace = true
parking_lot.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
hutan-gateway = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
tracing-subscriber.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
