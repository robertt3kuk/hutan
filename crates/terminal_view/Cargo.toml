[package]
name = "hutan-terminal-view"
description = "Hutan GPUI terminal view: draws the daemon's render stream, encodes keyboard and mouse input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "hutan_terminal_view"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
hutan-protocol.workspace = true
hutan-client.workspace = true
hutan-settings.workspace = true
image.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[dev-dependencies]
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
hutan-core.workspace = true
hutan-daemon.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple.workspace = true

[[example]]
name = "attach"
path = "examples/attach.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
