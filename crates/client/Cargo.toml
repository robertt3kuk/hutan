[package]
name = "hutan-client"
description = "Hutan async protocol client: connect (optionally autostarting hutand), calls, events, terminal streams, and a reconnecting Connection with a state store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
bytes.workspace = true
futures.workspace = true
hutan-core.workspace = true
hutan-protocol.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "process", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
hutan-daemon.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
