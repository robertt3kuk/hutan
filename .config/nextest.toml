# Test runner settings for `just check` (cargo-nextest).
#
# Many integration tests start real daemons, PTYs and fake agents with 15–20 s deadlines. On a
# loaded machine (parallel implementer worktrees, a fresh binary's first exec being vetted by
# macOS) those deadlines are sometimes missed although the code is fine. A failed test is run
# again up to twice; nextest still reports it as FLAKY, so a test that needs a retry is visible
# in every run and can be fixed. Assertions are not relaxed.
#
# Four test threads: each daemon/desktop test spawns processes and PTYs; more threads on the
# 16 GB dev laptop only add memory pressure and deadline misses. Override with `-j N`.
[profile.default]
retries = { backoff = "fixed", count = 2, delay = "2s" }
slow-timeout = { period = "30s", terminate-after = 6 }
fail-fast = false
test-threads = 4

# The flood test pushes megabytes through a debug-build emulator and is CPU-bound: it runs with
# the whole test-thread budget to itself, so the other tests' daemons do not stretch it.
[[profile.default.overrides]]
filter = 'package(hutan-daemon) & test(=sessions::ack_pacing_keeps_floods_bounded_and_the_daemon_responsive)'
threads-required = "num-test-threads"

# macOS delivers file events through one system daemon (fseventsd) for every process. Measured
# with the daemon's own debug log (FX-GATE-TESTS): a write right after `fs.watch` reaches the
# daemon 1–3 s later on a quiet machine, 10 s and more while another process creates 100 000
# files, and the daemon's own part of it is about 0.1 s. The tests that wait for such events
# therefore do not run beside each other, and the test that creates 100 000 files (a flood of
# events for everybody) runs with the whole thread budget to itself.
[test-groups]
fs-events = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(hutan-daemon) & (test(/^files::/) | test(/^fs_ops::/))'
test-group = "fs-events"

[[profile.default.overrides]]
filter = 'package(hutan-desktop) & test(=files_filter_gpui::a_project_of_a_hundred_thousand_files_answers_with_at_most_two_hundred)'
threads-required = "num-test-threads"
