[graph]
all-features = true

[advisories]
yanked = "deny"
# Transitive dependencies of the pinned GPUI (ADR 0003); informational "unmaintained" notices
# with no safe upgrade. Revisit on every GPUI bump.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, pulled in by gpui" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, pulled in by gpui/fontdb" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, pulled in by gpui_wgpu/usvg" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, pulled in by gpui_linux (zbus); not built on macOS" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, pulled in by gpui_linux (zbus); not built on macOS" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, pulled in by gpui_linux (zbus); not built on macOS" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  # borrow-or-share (via fluent-uri, ls-types: the LSP client's URIs): MIT without the
  # attribution clause, more permissive than MIT.
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0", # notify (file watcher); public-domain dedication
  # webpki-root-certs, pulled in by rustls-platform-verifier (reqwest, the model gateway): the
  # Mozilla CA list as data, permissively licensed. On macOS the verifier uses the system trust
  # store; the list is only a fallback it links.
  "CDLA-Permissive-2.0",
  "ISC",
  # File-level copyleft only: used unmodified by GPUI's font stack (cbindgen, dwrote, option-ext).
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Workspace crates are `publish = false` and licensed MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/zed-industries/zed",
  # Git dependencies of the pinned zed revision (ADR 0003).
  "https://github.com/zed-industries/font-kit",
  "https://github.com/proptest-rs/proptest",
]
