[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertt3kuk/hutan"

[workspace.dependencies]
hutan-agents = { path = "crates/agents" }
hutan-buffer = { path = "crates/buffer" }
hutan-chat-view = { path = "crates/chat_view" }
hutan-client = { path = "crates/client" }
hutan-code-view = { path = "crates/code_view" }
hutan-core = { path = "crates/core" }
hutan-daemon = { path = "crates/daemon" }
hutan-gateway = { path = "crates/gateway" }
hutan-index = { path = "crates/index" }
hutan-protocol = { path = "crates/protocol" }
hutan-settings = { path = "crates/settings" }
hutan-storage = { path = "crates/storage" }
hutan-syntax = { path = "crates/syntax" }
hutan-terminal = { path = "crates/terminal" }
hutan-terminal-view = { path = "crates/terminal_view" }
hutan-vim = { path = "crates/vim" }

anyhow = "1.0.104"
# Inline image data of attachments (protocol 0.23) and the images providers take.
base64 = "0.22.1"
bitflags = { version = "2.13.2", features = ["serde"] }
block2 = "0.6.2"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
# Rope of the editor buffer (hutan-buffer): byte metric, UTF-16 metric, O(1) snapshots (E-1 bench in
# docs/perf.md). Exact pin: the buffer relies on how this version treats a UTF-16 offset inside a
# surrogate pair (rounds down; guarded by a test).
crop = { version = "=0.4.3", features = ["utf16-metric"] }
crossterm = { version = "0.29.0", default-features = false }
# Hands work to the main thread's run loop (the daemon's Cocoa side, ADR 0007).
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "alloc", "objc2"] }
futures = "0.3.34"
# Honours .gitignore / .ignore when the daemon's file service lists, indexes and searches a
# folder (hutan-daemon `fs`, E-3); the same rules ripgrep applies.
ignore = "0.4.33"
libc = "0.2.190"
notify = "8.2.0"
# Native notifications posted by the daemon (ADR 0007): Objective-C bindings, macOS only.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
# Menu bar status items (the desktop's, M6-C, and the daemon's, M6-D), Dock badge, activation and
# the daemon's stop confirmation, the keyboard focus indicator color (`ui.focus`): AppKit, macOS only.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAlert", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSCell", "NSColor", "NSColorSpace", "NSControl", "NSDockTile", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSBundle", "NSDate", "NSError", "NSObject", "NSObjCRuntime", "NSRunLoop", "NSSet", "NSString", "NSTimer"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# `SMAppService`, the "keep running" launch agent registration (M6-C), macOS only.
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
parking_lot = "0.12.5"
# Parses the bundle's property lists in the xtask bundle test (dev only).
plist = "1.10.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Property tests of hutan-buffer (dev only).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
# Regex over a rope without flattening it (hutan-buffer search); `ropey` support is not used.
regex-cursor = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
# HTTP for the model gateway (ADR 0008): rustls with the `ring` provider (installed by hutan-gateway,
# `rustls-no-provider`) and the platform verifier for roots; aws-lc is avoided for its OpenSSL license.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
# Renders the app icon from the brand SVG (`xtask icon`); no text, no system fonts.
resvg = { version = "0.46.0", default-features = false }
# The rope hutan-buffer did not pick (E-1 bench, dev only).
ropey = "1.6.1"
roxmltree = "0.21.1"
rustix = { version = "1.1.5", features = ["fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
# macOS Keychain for provider credentials (ADR 0008).
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Hash of an attached image: the journal keeps path and hash, never the bytes.
sha2 = "0.10.9"
# Minimal diff of an external file change (hutan-buffer `apply_external`).
similar = { version = "3.2.0", default-features = false, features = ["std"] }
svgtypes = "0.16.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Editor syntax (hutan-syntax, E-2): tree-sitter and the grammars compiled in behind its cargo
# features. Exact pins: a grammar's node kinds are the contract of the vendored queries.
tree-sitter = "=0.27.1"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.3"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"
ulid = { version = "3.0.0", features = ["serde"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"

# Pinned by ADR 0004 (terminal engine) and ADR 0003 (GPUI); used from M1/M2.
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "ef376006f32728b15e6a67706a04849cb781c812", default-features = false }
# Only for terminal_view's real-font shaping test (macOS text system without a window/main thread).
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "ef376006f32728b15e6a67706a04849cb781c812", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ef376006f32728b15e6a67706a04849cb781c812", default-features = false, features = ["font-kit", "runtime_shaders"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debug builds keep file:line for backtraces but no variable info: full debuginfo made each
# checkout's target 30–55 GB and linking the desktop test binaries memory-heavy.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The VT engine and the terminal crate run in every debug-built daemon and desktop test; left
# unoptimized they are ~10x slower and the flood tests (20 MB through the engine) time out.
[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.dev.package.vte]
opt-level = 3

[profile.dev.package.hutan-terminal]
opt-level = 3
