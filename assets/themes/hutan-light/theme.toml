# hutan-light: the built-in light color pack. A root pack: it declares every required token, both
# density tables and the shared metrics, and is parsed by the same loader as a user's pack
# (docs/themes.md). Optional roles (diff, state, block overlay, ...) fall back per token.
schema_version = 1
id = "hutan-light"
name = "Hutan Light"
authors = ["Hutan"]
license = "MIT OR Apache-2.0"
version = "1.0.0"
description = "The built-in light theme."
appearance = "light"
root = true

[colors]
"ui.background" = "#faf9f5"
"ui.sidebar.background" = "#f3f1ea"
"ui.sidebar.selected" = "#e9e6dc"
# Two chrome tones: the right sidebar is the left sidebar's (CL-TOKENS, D-C2).
"ui.sidebar-right.background" = "#f3f1ea"
"ui.sidebar-right.selected" = "#e9e6dc"
"ui.surface" = "#ffffff"
"ui.surface.hover" = "#f0eee6"
"ui.border" = "#e6e3d9"
"ui.foreground" = "#1f1e1d"
"ui.text.muted" = "#66645d"
"ui.text.faint" = "#a8a59c"
"ui.accent" = "#e0692e"
"ui.accent.soft" = "#fbe9df"
# Dark ink on the brand orange: 4.94:1 (white was 3.37:1; D-C1).
"ui.on-accent" = "#1f1e1d"
# State words are text: each is the terminal's own ANSI color, 4.5:1 or better on bg, surface, sidebar and hover.
"state.success" = "#2f7a48"
"state.warning" = "#8a6300"
"state.error" = "#b93a26"
# Find matches: the default (the warning color at 28 % / 60 %) made every match a pale tan on the
# paper and the current one barely stronger. A pale amber for every match, a saturated one for
# the current match (dark ink on it: 7.7:1).
"editor.search-match" = "#f3e2b0"
"editor.search-match.active" = "#e8a838"
# Links are the only accent text; the brand orange itself is 3.20:1 on bg.
"markdown.link" = "#b04818"
# Black at 12 % (31/255 = 0.1216) and 28 % (71/255 = 0.2784).
"ui.shadow" = "#0000001f"
"ui.scrim" = "#00000047"
"terminal.foreground" = "#1f1e1d"
"terminal.background" = "#faf9f5"
"terminal.cursor" = "#e0692e"
# Dark ink under a block cursor: 4.94:1 on the orange (the paper-colored default was 3.2:1).
"terminal.cursor.foreground" = "#1f1e1d"
"terminal.selection.background" = "#f3d5c3"
"terminal.ansi.black" = "#1f1e1d"
"terminal.ansi.red" = "#b93a26"
"terminal.ansi.green" = "#2f7a48"
"terminal.ansi.yellow" = "#8a6300"
"terminal.ansi.blue" = "#2b62b8"
"terminal.ansi.magenta" = "#8e4ea8"
"terminal.ansi.cyan" = "#167780"
"terminal.ansi.white" = "#6f6d66"
"terminal.ansi.bright-black" = "#57554f"
"terminal.ansi.bright-red" = "#c8452f"
"terminal.ansi.bright-green" = "#3f8f5a"
"terminal.ansi.bright-yellow" = "#9a6f00"
"terminal.ansi.bright-blue" = "#3d77d1"
"terminal.ansi.bright-magenta" = "#a35fbf"
"terminal.ansi.bright-cyan" = "#23909a"
"terminal.ansi.bright-white" = "#8c8a82"

# Editor syntax colors (E-4), each at least 4.5:1 on editor.background (derived from
# ui.background); the editor.* surface roles are all derived (docs/themes.md).
"syntax.comment" = "#6f6d66"
"syntax.string" = "#2f7a48"
"syntax.string.escape" = "#167780"
"syntax.number" = "#a8480f"
"syntax.constant" = "#9a4a1a"
"syntax.keyword" = "#8e4ea8"
"syntax.operator" = "#4a4944"
"syntax.function" = "#2b62b8"
"syntax.function.method" = "#1d4f99"
"syntax.type" = "#8a6300"
"syntax.type.builtin" = "#7a5600"
"syntax.variable" = "#1f1e1d"
"syntax.variable.parameter" = "#5a4a2a"
"syntax.property" = "#1a6f8f"
"syntax.attribute" = "#a0402a"
"syntax.tag" = "#b93a26"
"syntax.punctuation" = "#6f6d66"
"syntax.punctuation.bracket" = "#57554f"
"syntax.markup.heading" = "#a8480f"
"syntax.markup.bold" = "#1f1e1d"
"syntax.markup.italic" = "#4a4944"
"syntax.markup.link" = "#2b62b8"

[fonts]
ui = [".SystemUIFont"]
prose = [".SystemUIFont"]
mono = ["Menlo"]

[density.compact]
"sidebar.row-height" = 26
"tab.height" = 30
"pane.header-height" = 30
"status-bar.height" = 24
spacing = 4
"radius.control" = 6
"radius.card" = 10
"text.body.size" = 12
"text.secondary.size" = 11
"text.section.size" = 11
"text.prose.size" = 15
"text.prose.line-height" = 1.6
"control.height" = 28
"button.height-compact" = 24
"terminal.padding" = 8
"terminal.block-gutter" = 3

[density.comfortable]
"sidebar.row-height" = 30
"tab.height" = 34
"pane.header-height" = 36
"status-bar.height" = 24
spacing = 6
"radius.control" = 6
"radius.card" = 10
"text.body.size" = 13
"text.secondary.size" = 12
"text.section.size" = 11
"text.prose.size" = 15
"text.prose.line-height" = 1.6
"control.height" = 28
"button.height-compact" = 24
"terminal.padding" = 12
"terminal.block-gutter" = 4

[metrics]
"titlebar.height" = 36
"radius.pill" = 999
"reading.width" = 720
"mascot.size" = 96
"nav.text.size" = 13
"nav.icon.size" = 16
"nav.line-height" = 18
"nav.padding-x" = 8
"nav.padding-y" = 6
"nav.gap" = 2
"strip.button.size" = 28
"strip.gap" = 4
"button.padding-x" = 12
"button.padding-x-compact" = 8
"button.icon.hit" = 28
"button.icon.size" = 16
"button.disabled-opacity" = 0.45
"terminal.font-size" = 13
"terminal.line-height" = 1.2
"shadow.offset-x" = 0
"shadow.offset-y" = 8
"shadow.blur" = 24
"shadow.spread" = 0
